name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TheftGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TheftGuard-apk
          path: TheftGuard.apk

      # Publish to a fixed "latest-apk" release so the phone can download it with one tap.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk TheftGuard.apk \
            --target "${{ github.sha }}" \
            --title "Theft Guard (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Download TheftGuard.apk on your Android phone and install it (allow installing from unknown sources when asked)."
